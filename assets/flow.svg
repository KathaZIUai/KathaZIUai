<text x="95.0" y="146.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3efff">⚡ Trigger</text>
<text x="95.0" y="165.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c4b5fd">email · webhook · cron</text></g><g class="node n-R"><rect x="200" y="120" width="150" height="60" rx="14" fill="#1e1538" stroke="#7c3aed" stroke-width="1.5"/>
<text x="275.0" y="146.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3efff">Rules</text>
<text x="275.0" y="165.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c4b5fd">validation first</text></g><g class="node n-AI"><rect x="390" y="105" width="190" height="90" rx="14" fill="#1e1538" stroke="#7c3aed" stroke-width="1.5"/>
<text x="485.0" y="146.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3efff">🤖 LLM decides</text>
<text x="485.0" y="165.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c4b5fd">confidence score on every answer</text></g><g class="node n-A"><rect x="690" y="60" width="130" height="60" rx="14" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
<text x="755.0" y="86.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3efff">✅ Action</text>
<text x="755.0" y="105.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c4b5fd">routine work</text></g><g class="node n-Hm"><rect x="690" y="180" width="150" height="60" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
<text x="765.0" y="206.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3efff">🙋 Human approval</text>
<text x="765.0" y="225.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c4b5fd">customer-facing · financial</text></g><g class="node n-L"><rect x="870" y="120" width="110" height="60" rx="14" fill="#1e1538" stroke="#7c3aed" stroke-width="1.5"/>
<text x="925.0" y="146.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3efff">📜 Log</text>
<text x="925.0" y="165.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c4b5fd">measure first</text></g>
