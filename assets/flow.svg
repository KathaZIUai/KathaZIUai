th href="#e5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.157;0.187;1" dur="6.4s" begin="3.8s" repeatCount="indefinite"/></circle><circle r="4.5" fill="#60a5fa" filter="url(#pglow)" opacity="0"><animateMotion dur="6.4s" begin="4.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.187;1" calcMode="linear"><mpath href="#e6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.157;0.187;1" dur="6.4s" begin="4.4s" repeatCount="indefinite"/></circle>
