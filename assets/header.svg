<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Katha Pawale, AI Full-Stack Developer">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0614"/><stop offset=".5" stop-color="#1a1033"/><stop offset="1" stop-color="#0b0614"/></linearGradient>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".08"/></pattern>
<filter id="softglow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="h-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fa4ff"/><stop offset=".5" stop-color="#3b6bff"/><stop offset="1" stop-color="#2a55e5"/></linearGradient>
<linearGradient id="h-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#2f5be8"/></linearGradient>
<filter id="h-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="nameclip"><rect class="reveal" x="90" y="80" width="640" height="80"/></clipPath></defs>
<style>
.zb-shadow{fill:#000;opacity:.18;transform-origin:32px 58.5px;animation:zb-shadow 3.2s ease-in-out infinite}
.zb-fig{transform-origin:32px 32px;animation:zb-bob 3.2s ease-in-out infinite}
@keyframes zb-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes zb-shadow{0%,100%{transform:scaleX(1);opacity:.18}50%{transform:scaleX(.86);opacity:.1}}
.zb-eyes{transform-origin:32px 22.5px;animation:zb-blink 4.6s ease-in-out infinite}
@keyframes zb-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.zb-ant{transform-origin:32px 3.8px;animation:zb-pulse 2.2s ease-in-out infinite}
.zb-light{transform-origin:32px 43.5px;animation:zb-pulse 2.2s ease-in-out .5s infinite}
@keyframes zb-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
.zb-arm-l{transform-origin:21px 40.6px;transform:rotate(8deg)}
.zb-arm-r{transform-origin:43px 40.6px;transform:rotate(-8deg)}
.zb-finger{opacity:0}
.zbot-idle .zb-arm-l{animation:zb-arm-l 3.2s ease-in-out infinite}
.zbot-idle .zb-arm-r{animation:zb-arm-r 3.2s ease-in-out infinite}
@keyframes zb-arm-l{0%,100%{transform:rotate(8deg)}50%{transform:rotate(16deg)}}
@keyframes zb-arm-r{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-16deg)}}
.zbot-wave .zb-arm-r{animation:zb-wave 1.4s ease-in-out infinite}
@keyframes zb-wave{0%,100%{transform:rotate(-62deg)}50%{transform:rotate(-100deg)}}
.zb-ring{fill:none;stroke:#3b6bff;stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center}
.zbot-listening .zb-ring{animation:zb-ring 1.6s ease-out infinite}
.zbot-listening .zb-ring-r{animation-delay:.3s;stroke:#6fe3ff}
@keyframes zb-ring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.zb-orbit{transform-origin:32px 21px;animation:zb-spin 2.4s linear infinite}
.zb-orbit-2{animation-duration:3.4s;animation-direction:reverse}
.zbot-thinking .zb-ant{animation-duration:.9s}
.zbot-thinking .zb-face{animation:zb-look 2.4s ease-in-out infinite}
@keyframes zb-look{0%,100%{transform:translate(0,0)}30%{transform:translate(1.6px,-.8px)}60%{transform:translate(-1.6px,-.8px)}}
@keyframes zb-spin{to{transform:rotate(360deg)}}
.zbot-building .zb-arm-r{transform:rotate(-40deg);animation:none}
.zb-blk{transform-box:fill-box;transform-origin:center;animation:zb-pop 2.4s cubic-bezier(.22,1,.36,1) infinite}
.zb-blk-2{animation-delay:.3s}.zb-blk-3{animation-delay:.6s}
@keyframes zb-pop{0%{transform:translate(-10px,10px) scale(.2);opacity:0}25%,78%{transform:none;opacity:1}100%{transform:translateY(-4px);opacity:0}}
.zb-badge{transform-box:fill-box;transform-origin:center;animation:zb-in .45s cubic-bezier(.22,1,.36,1) .6s both}
.zbot-done .zb-arm-l{transform:rotate(38deg);animation:none}
.zbot-done .zb-arm-r{transform:rotate(-38deg);animation:none}
.zbot-done .zb-fig{animation:zb-bob 3.2s ease-in-out infinite, zb-hop .6s cubic-bezier(.22,1,.36,1) .4s 1}
@keyframes zb-in{from{transform:scale(0);opacity:0}}
@keyframes zb-hop{0%{transform:translateY(0)}40%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.zbot-pointing .zb-arm-r{animation:zb-point 1.6s ease-in-out infinite}
.zbot-pointing .zb-finger{opacity:1}
@keyframes zb-point{0%,100%{transform:rotate(-22deg) translate(2px,0)}50%{transform:rotate(-22deg) translate(5px,0)}}
.zb-zzz path{animation:zb-z 2.4s ease-in-out infinite;opacity:0}
.zb-zzz .z2{animation-delay:.8s}
@keyframes zb-z{0%{opacity:0;transform:translate(0,4px)}30%,70%{opacity:1}100%{opacity:0;transform:translate(3px,-6px)}}
.zbot-sleeping .zb-eyes{animation:none}
.zbot-sleeping .zb-fig{animation-duration:5s}
.zbot-sleeping .zb-ant,.zbot-sleeping .zb-light{animation:none;opacity:.35}
.zbot-sleeping .zb-arm-l,.zbot-sleeping .zb-arm-r{animation:none}
.zbot-sleeping .zb-head{transform-origin:32px 30px;transform:rotate(6deg)}

.reveal{animation:reveal 1.4s cubic-bezier(.22,1,.36,1) .2s both}@keyframes reveal{from{width:0}}
.fade{animation:fade .8s ease both}.d1{animation-delay:1.2s}.d2{animation-delay:1.6s}.d3{animation-delay:2s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.rot{animation:rot 12s infinite both}.rot1,.rot2{opacity:0}.rot1{animation-delay:4s}.rot2{animation-delay:8s}
@keyframes rot{0%{opacity:0;transform:translateY(6px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0}}
.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.orb1{animation:orb1 7s ease-in-out infinite}@keyframes orb1{50%{transform:translateY(26px)}}
.orb2{animation:orb2 9s ease-in-out infinite}@keyframes orb2{50%{transform:translateX(30px)}}
.shine{animation:shine 5s linear infinite}@keyframes shine{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
.dotin{animation:dotin 1s cubic-bezier(.22,1,.36,1) .6s both}@keyframes dotin{from{opacity:0;transform:translate(60px,0)}}
.bubble{animation:fade .6s ease 1.8s both}
.spark{animation:spark 3s ease-in-out infinite}.s2{animation-delay:1s}.s3{animation-delay:2s}
@keyframes spark{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
</style>
<rect width="1200" height="320" rx="20" fill="url(#bg)"/><rect width="1200" height="320" rx="20" fill="url(#grid)"/>
<circle class="orb1" cx="1060" cy="60" r="100" fill="#7c3aed" opacity=".18" filter="url(#softglow)"/>
<circle class="orb2" cx="120" cy="270" r="80" fill="#3b82f6" opacity=".16" filter="url(#softglow)"/>
<rect x="70" y="86" width="6" height="134" rx="3" fill="url(#grad)"/>
<g clip-path="url(#nameclip)"><text x="100" y="140" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#grad)" letter-spacing="-1">Katha Pawale</text></g>
<text class="fade d1" x="102" y="182" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e9e3ff">AI Full-Stack Developer</text>
<text class="rot rot0" x="102" y="214" font-family="Menlo, Consolas, monospace" font-size="17" fill="#a78bfa">&gt; React · Next.js · Node.js · TypeScript · Supabase<tspan class="cursor" fill="#60a5fa">▌</tspan></text><text class="rot rot1" x="102" y="214" font-family="Menlo, Consolas, monospace" font-size="17" fill="#a78bfa">&gt; auth systems · REST APIs · real-time data · responsive UI<tspan class="cursor" fill="#60a5fa">▌</tspan></text><text class="rot rot2" x="102" y="214" font-family="Menlo, Consolas, monospace" font-size="17" fill="#a78bfa">&gt; AI agents &amp; automation workflows with Claude and GPT<tspan class="cursor" fill="#60a5fa">▌</tspan></text>
<g class="fade d2"><rect x="100" y="238" width="236" height="34" rx="17" fill="#1e1538" stroke="#7c3aed" stroke-opacity=".6"/>
<text x="218" y="260" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#c4b5fd">📍 Vadodara, Gujarat, India</text></g>
<g class="fade d3"><rect x="348" y="238" width="250" height="34" rx="17" fill="#1e1538" stroke="#3b82f6" stroke-opacity=".6"/>
<text x="473" y="260" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#93c5fd">🎓 B.Tech CE · BVM · 2026</text></g>
<g transform="translate(820,100)" fill="#a78bfa"><circle class="spark" cx="0" cy="0" r="3"/><circle class="spark s2" cx="40" cy="-30" r="2"/><circle class="spark s3" cx="-30" cy="40" r="2.5"/></g>
<g class="dotin"><g class="zbot zbot-wave" transform="translate(930,70) scale(3.28125)">
<ellipse class="zb-shadow" cx="32" cy="58.5" rx="12" ry="2.4"/>
<g class="zb-fig">
<g class="zb-head-tilt"><line x1="32" y1="9.5" x2="32" y2="5" stroke="#5b8cff" stroke-width="2" stroke-linecap="round"/><circle class="zb-ant" cx="32" cy="3.8" r="2.6" fill="#6fe3ff" filter="url(#h-glow)"/></g>
<rect class="zb-arm zb-arm-l" x="11" y="38" width="11" height="5.2" rx="2.6" fill="url(#h-b)"/>
<g class="zb-arm zb-arm-r"><rect x="42" y="38" width="11" height="5.2" rx="2.6" fill="url(#h-b)"/><rect class="zb-finger" x="52" y="39.1" width="5" height="3" rx="1.5" fill="#5b8cff"/></g>

<rect x="23" y="50.5" width="7.5" height="5" rx="2.5" fill="#2446c4"/><rect x="33.5" y="50.5" width="7.5" height="5" rx="2.5" fill="#2446c4"/>
<rect x="21" y="36" width="22" height="16" rx="8" fill="url(#h-g)"/>
<circle class="zb-light" cx="32" cy="43.5" r="2.6" fill="#6fe3ff" filter="url(#h-glow)"/>
<g class="zb-head"><rect x="10" y="18" width="5" height="9" rx="2.5" fill="#2446c4"/><rect x="49" y="18" width="5" height="9" rx="2.5" fill="#2446c4"/>
<rect x="14" y="9" width="36" height="26.5" rx="11" fill="url(#h-g)"/><rect x="19" y="14" width="26" height="16.5" rx="7" fill="#0b1020"/>
<g class="zb-face"><g class="zb-eyes" fill="none" stroke="#6fe3ff" stroke-width="2.4" stroke-linecap="round" filter="url(#h-glow)"><path d="M23.5 22.5 q3.5 -4.5 7 0"/><path d="M33.5 22.5 q3.5 -4.5 7 0"/></g>
<path d="M29.2 26.2 q2.8 2.2 5.6 0" fill="none" stroke="#6fe3ff" stroke-width="1.5" stroke-linecap="round" opacity=".9"/></g></g>
</g></g>
<g transform="translate(922,62)"><g class="bubble"><rect x="-364" y="0" width="364" height="36" rx="12" fill="#1e1538" stroke="#7c3aed" stroke-opacity=".7"/><path d="M0 24 l8 7 l-8 1z" fill="#1e1538" stroke="#7c3aed" stroke-opacity=".7"/>
<text x="-350" y="23" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#e9e3ff">Hi! I'm Dot 👋 Katha builds bots like me.</text></g></g></g>
<rect class="shine" x="0" y="314" width="1200" height="3" fill="url(#shine)"/>
</svg>