<text x="640" y="232" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#93c5fd">unusual</text>
<text x="780" y="155" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#93c5fd">approved ↑</text>
<text x="855" y="262" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#93c5fd">rejected → back to queue</text>
